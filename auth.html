<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Pitch Tagger</title>
<meta name="robots" content="noindex">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js?v=1"></script>
<style>
  /* Red and black, the same tokens index.html, shared.css and the client site
     carry — this is the first screen anyone sees, so it should not be the one
     page in its own palette. Left alone on purpose: --danger / --warn, and --ok
     below, which say failed or succeeded rather than anything about the brand. */
  :root{
    --bg:#000000; --panel:#0C0A0B; --panel2:#141011; --line:#2A2325;
    --ink:#EFEAE8; --mut:#9C8F92; --accent:#E0122B;
    --danger:#f7506b; --warn:#f7b32f; --ok:#39d98a;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
       font-family:"Segoe UI",system-ui,sans-serif;font-size:13px;color:var(--ink);
       /* the same faint glow behind the card, in the brand red instead of pitch green */
       background:radial-gradient(900px 520px at 50% -10%,#36060E 0%,var(--bg) 62%)}
  .auth{width:100%;max-width:390px;display:flex;flex-direction:column;align-items:stretch;gap:14px}

  .brand{font-size:34px;font-weight:800;letter-spacing:.5px;margin:0;text-align:center;line-height:1.1}
  .brand span{color:var(--accent)}
  .tag{margin:0 0 6px;text-align:center;color:var(--mut);font-size:12px;letter-spacing:2.2px;text-transform:uppercase}

  /* Sign in / Sign up switch */
  .tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
  .tabs button{flex:1;background:transparent;border:0;color:var(--mut);font:inherit;font-weight:700;
               padding:9px 0;border-radius:999px;cursor:pointer}
  /* white on the red, as everywhere else the accent is a filled button */
  .tabs button.on{background:var(--accent);color:#fff}
  .tabs button:not(.on):hover{color:var(--ink)}

  form{display:flex;flex-direction:column;gap:10px;margin:0}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld>span{font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.4px;padding-left:14px}
  .fld input{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
             border-radius:999px;padding:12px 16px;font:inherit;font-size:13px;width:100%}
  .fld input::placeholder{color:#6E6265}
  .fld input:focus{outline:none;border-color:var(--accent);background:#1C1618}
  /* whichever form is not in use is display:none — it stays in the document, but a
     password manager reads each form on its own, so the other one cannot confuse it */
  .hide{display:none}

  .primary{margin-top:4px;background:var(--accent);color:#fff;border:0;border-radius:999px;
           padding:12px 0;font:inherit;font-size:14px;font-weight:800;cursor:pointer}
  .primary:hover{filter:brightness(1.08)}
  .primary[disabled]{opacity:.6;cursor:progress}

  /* Continue with Google, under both forms and outside either of them */
  .or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:11px}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
  /* Google's own light button, kept as they specify it rather than restyled in the
     brand red — a provider button that does not look like the provider's is one more
     thing for a visitor to hesitate over on the screen where they hand over an account */
  .google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
          background:#fff;color:#1f1f1f;border:0;border-radius:999px;padding:11px 0;
          font:inherit;font-size:13px;font-weight:700;cursor:pointer}
  .google:hover{filter:brightness(.94)}
  .google[disabled]{opacity:.6;cursor:progress}
  .google svg{width:17px;height:17px;flex:none}

  /* the password rules, spelled out under the field instead of only on rejection */
  .rules{margin:-2px 0 0;padding-left:14px;color:var(--mut);font-size:11px;line-height:1.5}

  .msg{margin:0;padding:10px 14px;border-radius:10px;font-size:12px;line-height:1.5;display:none;white-space:pre-line}
  .msg.show{display:block}
  .msg.bad{background:#2a1620;border:1px solid var(--danger);color:#ffc3ce}
  .msg.ok{background:#12281d;border:1px solid var(--ok);color:#bff0d6}
  .msg.info{background:var(--panel);border:1px solid var(--line);color:var(--mut)}

  .foot{margin:0;text-align:center;color:var(--mut);font-size:11px;line-height:1.6}
  .foot b{color:#C9BFBD;font-weight:600}
</style>
</head>
<body>
<main class="auth">
  <h1 class="brand">Hoang<span>Nam</span></h1>
  <p class="tag">Football Data Labeling</p>

  <div class="tabs" role="tablist">
    <button type="button" id="tabIn" class="on" role="tab">Sign in</button>
    <button type="button" id="tabUp" role="tab">Sign up</button>
  </div>

  <!-- TWO forms, not one with fields hidden by CSS. A password manager reads form.elements
       and never looks at what is on screen, so a single form holding both a current-password
       and a new-password field (plus a name) is read as a sign-up or change-password form —
       and those are not offered the login you saved. Sign in is therefore a form with
       nothing in it but username + current-password, which is unmistakable. -->
  <form id="signInForm" novalidate autocomplete="on">
    <label class="fld">
      <span>Email</span>
      <input id="siEmail" name="email" type="email" autocomplete="username" placeholder="you@gmail.com" required>
    </label>
    <label class="fld">
      <span>Password</span>
      <input id="siPassword" name="password" type="password" autocomplete="current-password" placeholder="Your password" required>
    </label>
    <button class="primary" id="siSubmit" type="submit">Sign in</button>
  </form>

  <form id="signUpForm" class="hide" novalidate autocomplete="on">
    <label class="fld">
      <span>Full name</span>
      <input id="suName" name="name" type="text" autocomplete="name" placeholder="Nguyen Van A">
    </label>
    <label class="fld">
      <span>Email</span>
      <input id="suEmail" name="email" type="email" autocomplete="username" placeholder="you@gmail.com" required>
    </label>
    <label class="fld">
      <span>Password</span>
      <input id="suPassword" name="new-password" type="password" autocomplete="new-password" placeholder="At least 6 characters" required>
    </label>
    <p class="rules">At least 6 characters, one capital letter (A–Z) and one special character (!&nbsp;?&nbsp;@&nbsp;#&nbsp;…).</p>
    <label class="fld">
      <span>Confirm password</span>
      <input id="suConfirm" name="confirm-password" type="password" autocomplete="new-password" placeholder="Type it again">
    </label>
    <button class="primary" id="suSubmit" type="submit">Create account</button>
  </form>

  <!-- OUTSIDE both forms, and type="button". A password manager reads form.elements and
       never looks at the screen: an extra control inside the sign-in form is one more
       thing for it to misread, and a button with no type inside a form submits it. -->
  <div class="or"><span>or</span></div>

  <button type="button" class="google" id="googleBtn">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.7 1.22 9.19 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    Continue with Google
  </button>

  <p class="msg" id="msg"></p>
  <p class="foot" id="foot">Sign in, or create an account, to open the site.</p>
</main>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const cfg = PTAuth.config();
  let sb = null, mode = 'in', busy = false;

  /* The one real Supabase client on this site: it signs in, and it persists the session
     under the default key (sb-<project-ref>-auth-token) — the very entry the gate in
     auth.js reads on every other page, and the one cloud-sync.js finds already there,
     so it never falls back to an anonymous sign-in. */
  function client() {
    if (!sb && window.supabase) sb = window.supabase.createClient(cfg.url, cfg.key);
    return sb;
  }

  function say(text, kind) {
    const m = $('msg');
    m.textContent = text || '';
    m.className = 'msg' + (text ? ' show ' + (kind || 'info') : '');
  }
  function working(on, label) {
    busy = on;
    const btn = $(mode === 'in' ? 'siSubmit' : 'suSubmit');
    btn.disabled = on;
    btn.textContent = on && label ? label : (mode === 'in' ? 'Sign in' : 'Create account');
  }
  const go = () => location.replace(PTAuth.nextUrl());

  /* ---------- what a new password has to be ----------
     Checked here so the rule is stated before Supabase is asked; Supabase's own minimum
     is looser, so nothing it accepts is rejected later. Sign-in is NOT held to this — an
     account made before the rule tightened must still be able to get in. */
  const PW_RULES = [
    [pw => pw.length >= 6,        'at least 6 characters'],
    [pw => /[A-Z]/.test(pw),      'one capital letter (A–Z)'],
    [pw => /[^A-Za-z0-9]/.test(pw), 'one special character (! ? @ # …)']
  ];
  function pwProblem(pw) {
    const missing = PW_RULES.filter(r => !r[0](pw)).map(r => r[1]);
    return missing.length ? 'Password needs ' + missing.join(', ') + '.' : null;
  }

  /* ---------- let the browser keep the credentials ----------
     A browser decides whether to offer to save from what it sees between a login form
     being submitted and the page going away. Measured, that gap here was 22ms: the login
     succeeded and we were already gone, so no prompt ever appeared and nothing was ever
     saved. Everything below buys the browser that moment.

     Two routes, because neither is reliable alone. credentials.store() asks outright,
     which Chrome and Edge answer with their own "Save password?" bubble — but it is
     absent or refused in some builds (this very page logs NotSupportedError in a
     stripped-down Chromium). The fallback is the form itself: a login form left standing
     in the DOM with its values, followed by a navigation to a page that has no login
     form, is what every password manager reads as "that worked". Both need us to wait. */
  const SETTLE_MS = 1200;
  const wait = ms => new Promise(r => setTimeout(r, ms));

  async function remember(email, pw, name) {
    try {
      if (window.PasswordCredential && navigator.credentials && navigator.credentials.store)
        await navigator.credentials.store(new window.PasswordCredential({
          id: email, password: pw, name: name || email
        }));
    } catch (e) { /* absent or declined — the form left standing is the fallback */ }
  }

  /* The email address only, and never the password: a password we stored would sit in
     localStorage in the clear, readable by any script on this origin. Keeping it is the
     browser's job. This just means the address is already there after a sign-out. */
  const LAST_EMAIL = 'pitchtagger.auth.email';
  const rememberEmail = e => { try { localStorage.setItem(LAST_EMAIL, e); } catch (x) {} };
  const lastEmail = () => { try { return localStorage.getItem(LAST_EMAIL) || ''; } catch (x) { return ''; } };

  /* ---------- the switch ----------
     Whichever form is hidden keeps its values; carrying the email across means switching
     tabs after a typo does not cost you the address you already typed. */
  function setMode(m) {
    mode = m;
    $('tabIn').classList.toggle('on', m === 'in');
    $('tabUp').classList.toggle('on', m === 'up');
    $('signInForm').classList.toggle('hide', m !== 'in');
    $('signUpForm').classList.toggle('hide', m !== 'up');
    const from = $(m === 'in' ? 'suEmail' : 'siEmail'), to = $(m === 'in' ? 'siEmail' : 'suEmail');
    if (from.value && !to.value) to.value = from.value;
    $('foot').textContent = m === 'in'
      ? 'No account yet? Choose Sign up to create one.'
      : 'Already have an account? Choose Sign in.';
    say('');
    /* Do not steal focus on the sign-in form: Chrome fills a saved login on its own, and
       focusing a field it has just filled can drop the fill in some versions. */
    if (m === 'up') $('suName').focus();
  }
  $('tabIn').onclick = () => setMode('in');
  $('tabUp').onclick = () => setMode('up');

  /* ---------- what Supabase says, in plain words ---------- */
  function explain(err) {
    const msg = (err && err.message) || String(err || 'Something went wrong.');
    if (/invalid login credentials/i.test(msg)) return 'Wrong email or password.';
    if (/email not confirmed/i.test(msg)) return 'This email has not been confirmed yet — open the link Supabase sent you, then sign in.';
    if (/already registered|already exists/i.test(msg)) return 'That email already has an account. Sign in instead.';
    // only sign-up can provoke this, so the new-password box is the one to explain
    if (/password should be at least|password.*weak/i.test(msg)) return 'Password is too weak. ' + (pwProblem($('suPassword').value) || 'Try a longer one.');
    if (/redirect|not allowed/i.test(msg) && /url/i.test(msg))
      return 'This address is not in the Supabase redirect allow-list.\nAdd it in Authentication → URL Configuration (see README).';
    if (/failed to fetch|networkerror|load failed/i.test(msg)) return 'Cannot reach Supabase — check your connection and try again.';
    if (/rate limit|too many/i.test(msg)) return 'Too many attempts. Wait a minute and try again.';
    // ---- what Google can send back ----
    if (/unsupported provider|provider is not enabled/i.test(msg))
      return 'Google sign-in is not enabled on this Supabase project yet.\nEnable it in Authentication → Providers → Google (see README).';
    if (/access_denied|user denied|cancelled|canceled/i.test(msg))
      return 'Google sign-in was cancelled. Nothing has changed.';
    if (/bad_oauth_state|invalid state|flow ?state|state not found/i.test(msg))
      return 'That sign-in took too long, or was finished in a different tab.\nPress Continue with Google again.';
    if (/identity is already linked|already linked to another user/i.test(msg))
      return 'That Google account is already attached to a different account here.\nSign in with your email and password instead.';
    return msg;
  }

  /* ---------- sign in ---------- */
  $('signInForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    if (busy) return;
    const c = client();
    if (!c) return say('Supabase could not be loaded — check your connection and reload the page.', 'bad');

    const email = $('siEmail').value.trim();
    const pw = $('siPassword').value;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return say('Enter a valid email address.', 'bad');
    if (!pw) return say('Enter your password.', 'bad');

    working(true, 'Signing in…');
    say('');
    try {
      const { error } = await c.auth.signInWithPassword({ email: email, password: pw });
      if (error) throw error;
      return land(email, pw, '');
    } catch (err) {
      working(false);
      say(explain(err), 'bad');
    }
  });

  /* ---------- sign up ---------- */
  $('signUpForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    if (busy) return;
    const c = client();
    if (!c) return say('Supabase could not be loaded — check your connection and reload the page.', 'bad');

    const name = $('suName').value.trim();
    const email = $('suEmail').value.trim();
    const pw = $('suPassword').value;
    const pw2 = $('suConfirm').value;

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return say('Enter a valid email address.', 'bad');
    if (!name) return say('Enter your full name.', 'bad');
    const problem = pwProblem(pw);
    if (problem) return say(problem, 'bad');
    if (pw !== pw2) return say('The two passwords do not match.', 'bad');

    working(true, 'Creating…');
    say('');
    try {
      const { data, error } = await c.auth.signUp({
        email: email, password: pw,
        options: { data: { full_name: name }, emailRedirectTo: PTAuth.authUrl() }
      });
      if (error) throw error;
      /* No session back means the project asks new accounts to confirm their email first
         (Supabase's default). The account exists — it just cannot be used until then, so
         offer to save the password now: it is the one they will sign in with afterwards,
         and carry it into the sign-in form so it is waiting for them. */
      if (!data.session) {
        rememberEmail(email);
        await remember(email, pw, name);
        working(false);
        setMode('in');
        $('siEmail').value = email;
        $('siPassword').value = pw;
        return say('Account created for ' + email + '.\nOpen the confirmation link Supabase just emailed you, then sign in here.', 'ok');
      }
      return land(email, pw, name);
    } catch (err) {
      working(false);
      say(explain(err), 'bad');
    }
  });

  /* ---------- Continue with Google ----------
     One button for both tabs, because with an OAuth provider there is no separate
     sign-up: the first time an address arrives it becomes an account, and every time
     after that it signs in. Nothing here asks for a password, so nothing here has one
     to save — the trip home lands in boot(), which calls land() with no arguments and
     therefore skips both remember() and the settle.

     The busy switch below is the button's own, and working() is never told about it.
     That is not tidiness: working() used to disable this very button on EVERY submit,
     so once the button was removed the leftover $('googleBtn') killed Sign in and
     Create account outright (909cf87). Two switches that do not know about each other
     cannot do that to each other. The forms already refuse to run while `busy`, and
     that is what turns a click here away in the middle of a password sign-in. */
  function gWorking(on) {
    busy = on;
    $('googleBtn').disabled = on;
  }

  /* signInWithOAuth only builds a URL and sends the browser to it, so a project that has
     not turned Google on yet answers AFTER we have gone — leaving the visitor staring at
     a raw {"code":400,"msg":"Unsupported provider…"} page with no way back. Ask first:
     that 400 comes back with CORS headers and is readable, while an enabled provider
     answers with a redirect to accounts.google.com that CORS makes this fetch throw on.
     So only a readable "not enabled" stops us — anything else (including being offline)
     goes ahead exactly as before.

     The race is the part the old version did not have. This check is insurance, not the
     feature, and on a slow connection it must not become the reason nothing happens. */
  const PREFLIGHT_MS = 1200;
  async function providerEnabled(url) {
    const ask = (async () => {
      try {
        const r = await fetch(url, { headers: { accept: 'application/json' } });
        const body = await r.text();
        if (!r.ok && /provider is not enabled|unsupported provider/i.test(body)) return false;
      } catch (e) { /* CORS or offline — neither of them says the provider is off */ }
      return true;
    })();
    return Promise.race([ask, new Promise(r => setTimeout(() => r(true), PREFLIGHT_MS))]);
  }

  $('googleBtn').onclick = async function () {
    if (busy) return;
    const c = client();
    if (!c) return say('Supabase could not be loaded — check your connection and reload the page.', 'bad');

    gWorking(true);
    say('Opening Google…', 'info');
    try {
      /* Come back to THIS page, ?next= and all, so the session is stored where the gate
         reads it and the redirect leftovers never reach the app's own #match= hash.
         origin + pathname + search is the address as it is actually served — never a
         guess, so it cannot drift from what Supabase's Redirect URLs allow. */
      const back = location.origin + location.pathname + location.search;
      const { data, error } = await c.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: back,
          skipBrowserRedirect: true,
          /* Every popular app lets you pick which Google account. Without this a browser
             signed into exactly one is sent straight through it with nothing to confirm. */
          queryParams: { prompt: 'select_account' }
        }
      });
      if (error) throw error;
      if (!await providerEnabled(data.url)) throw { message: 'Unsupported provider: provider is not enabled' };
      /* A breadcrumb for the case where `back` is not in the project's Redirect URLs:
         Supabase then drops the tokens on the Site URL — the client site's landing
         page — which reads this to know the trip started here and hands them back. */
      try { localStorage.setItem('hna.oauth.home', 'tagger/auth'); } catch (e) {}
      location.assign(data.url);
    } catch (err) {
      gWorking(false);
      say(explain(err), 'bad');
    }
  };

  /* The gate on the app pages reads the session out of localStorage, so only forward once
     it is actually readable there — otherwise the two would bounce the user back and forth. */
  async function land(email, pw, name) {
    if (email) { rememberEmail(email); await remember(email, pw, name); }
    if (!PTAuth.user()) {
      working(false);
      return say('Signed in, but this browser is not keeping the session.\nAllow cookies / site data for this site (private windows block it) and try again.', 'bad');
    }
    /* Only after someone actually filled the form — arriving with a session already in
       hand has nothing to save, and should not be made to wait. The form is deliberately
       left standing, values and all, for as long as this takes: clearing it or navigating
       straight away is exactly what stopped the browser offering to save. */
    if (email) { working(false); say('Signed in ✓ — opening the app…', 'ok'); await wait(SETTLE_MS); }
    go();
  }

  /* ---------- on load ---------- */
  (async function boot() {
    setMode('in');
    const c = client();
    if (!c) return say('Supabase could not be loaded — check your connection and reload the page.', 'bad');

    /* getSession() waits for the client to finish reading the URL, which is how the return
       trip from a confirmation link (tokens in the hash / ?code=) becomes a stored session.
       It also finds the session kept from last time: a signed-in browser never sees this
       screen again — closing the tab, or the machine, changes nothing. Only Sign out does. */
    let session = null;
    try { ({ data: { session } } = await c.auth.getSession()); } catch (e) {}

    if (session && session.user && !session.user.is_anonymous) return land();
    /* An anonymous session is what cloud-sync.js makes on its own to reach the database.
       It is not an account, and leaving it behind would only confuse the next sign-in. */
    if (session) { try { await c.auth.signOut(); } catch (e) {} }

    /* A confirmation link that has expired or been used already comes back here with the
       reason on the URL — without this the visitor would just see a blank sign-in form. */
    if (/error_description=|[?&]error=/.test(location.hash + location.search)) {
      const p = new URLSearchParams((location.hash || '').replace(/^#/, '') || location.search);
      say(explain({ message: p.get('error_description') || p.get('error') || 'That link is no longer valid.' }), 'bad');
    }
    /* Deliberately no focus() here: Chrome fills a saved login as the page settles, and
       grabbing focus mid-fill can throw the fill away.

       Same reason this waits and then checks the box is still empty — the browser's own
       fill always wins, and this only steps in when there was none, so the address is at
       least already there after a sign-out. */
    await wait(600);
    const box = $('siEmail');
    if (!box.value && document.activeElement !== box) box.value = lastEmail();
  })();
})();
</script>
</body>
</html>
