<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player lists — Pitch Tagger</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="../shared.css">
</head>
<body>
<header>
  <h1>Hoang<span>Nam</span> · Player lists &amp; formation</h1>
  <div class="stats-toggle" style="margin-left:14px">
    <button id="luHomeBtn"></button>
    <button id="luAwayBtn"></button>
  </div>
  <div class="spacer"></div>
  <a class="back-link" href="../">← Tagging</a>
</header>
<div class="page">
  <div class="lineup-body">
    <div class="lu-left">
      <!-- players stored on the team in the database (no shirt numbers — those are per match) -->
      <div class="lu-sec"><b>Team players — database</b> <span class="mini" id="dbStatus">…</span></div>
      <div class="lu-add" id="dbAddRow" style="display:none">
        <input id="dbName" placeholder="New player name" style="flex:1;width:auto">
        <input id="dbPos" placeholder="Pos" title="position, e.g. GK / CB / CM (optional)">
        <button id="dbAdd" title="Save the player to the team in the database">+</button>
      </div>
      <div class="lu-roster" id="dbRoster" style="flex:none;max-height:32vh"></div>
      <!-- this match's squad: DB players with the shirt number they wear TODAY -->
      <div class="lu-sec"><b>Match squad</b> <span class="mini">shirt numbers for this match</span></div>
      <div class="lu-add" id="luAddRow">
        <input id="luNo" placeholder="No" inputmode="numeric">
        <input id="luName" placeholder="Player name">
        <button id="luAdd" title="add player">+</button>
      </div>
      <div class="lu-roster" id="luRoster"></div>
    </div>
    <div class="lu-right">
      <div class="lu-pitchwrap"><div class="lu-pitch" id="luPitch"></div></div>
      <div class="lu-dir">
        <button id="luDir">⇄ Switch Attacking Direction</button>
        <span id="luCount"></span>
      </div>
      <div class="lu-subs"><b>Substitutes</b><div id="luSubs"></div></div>
    </div>
  </div>
</div>

<script src="../shared.js"></script>
<script>
let lineups=loadLineups(), meta=loadMeta(), lineupTeam='home';
function teamLU(){return lineups[lineupTeam];}
function maxXI(){return MAX_XI[meta.sport]||11;}
function rosterPlayer(t,no){return t.roster.find(p=>p.no===no);}
function save(){saveLineupsLS(lineups);}   // main tab picks this up via `storage` and refreshes its formation

/* ===== team players from the DATABASE (public.players) =====
   Players must be stored on the team in the database BEFORE they can join the
   match squad. DB players carry no shirt number — the number is assigned here,
   per match, when the player is added to the squad. */
const CLOUD_CFG='pitchtagger.cloud.cfg';
let sb=null, dbPlayers={home:[],away:[]}, dbErr='';
function teamIdFor(team){return team==='home'?meta.homeTeamId:meta.awayTeamId;}
async function initDB(){
  let c={}; try{c=JSON.parse(localStorage.getItem(CLOUD_CFG))||{};}catch(e){}
  if(!c.url||!c.key||!window.supabase){dbErr='chưa cấu hình Cloud (kết nối ở tab chính)';renderDbRoster();return;}
  try{
    sb=window.supabase.createClient(c.url,c.key);
    const {data:{session}}=await sb.auth.getSession();
    if(!session){const {error}=await sb.auth.signInAnonymously(); if(error)throw error;}
  }catch(e){sb=null;dbErr='không kết nối được database';renderDbRoster();return;}
  await loadDbPlayers();
}
async function loadDbPlayers(){
  if(!sb)return renderDbRoster();
  for(const team of ['home','away']){
    const tid=teamIdFor(team);
    if(!tid){dbPlayers[team]=[];continue;}
    const {data,error}=await sb.from('players').select('id,name,position').eq('team_id',tid).order('name');
    if(error){dbErr=error.message;dbPlayers[team]=[];}
    else dbPlayers[team]=data||[];
  }
  renderDbRoster();
}
function renderDbRoster(){
  const box=$('dbRoster'), st=$('dbStatus'), t=teamLU();
  const tid=teamIdFor(lineupTeam), dbOn=!!(sb&&tid);
  // enforce the DB flow: manual (offline) add is only available without a database link
  $('dbAddRow').style.display=dbOn?'flex':'none';
  $('luAddRow').style.display=dbOn?'none':'flex';
  box.innerHTML='';
  if(!dbOn){
    st.textContent=sb?'⚠ match chưa gắn team — tạo match từ Cloud (chọn team database)':'⚠ '+(dbErr||'offline');
    return;
  }
  st.textContent='✓ '+dbPlayers[lineupTeam].length+' cầu thủ';
  dbPlayers[lineupTeam].forEach(p=>{
    const inSquad=t.roster.find(r=>r.pid===p.id);
    const row=document.createElement('div'); row.className='lu-prow';
    row.innerHTML=`<span class="pname">${p.name}</span><span class="ppos">${p.position||''}</span>`;
    const b=document.createElement('button');
    if(inSquad){b.textContent='#'+inSquad.no;b.className='on';b.title='đã trong danh sách trận';b.disabled=true;}
    else{b.textContent='→ squad';b.title='thêm vào danh sách trận (nhập số áo)';b.onclick=()=>addToSquad(p);}
    row.appendChild(b); box.appendChild(row);
  });
  if(!dbPlayers[lineupTeam].length){
    const e=document.createElement('div');
    e.style.cssText='color:var(--mut);font-size:11px;padding:8px;text-align:center';
    e.textContent='Team chưa có cầu thủ nào trong database — thêm bằng ô bên trên.';
    box.appendChild(e);
  }
}
// save a NEW player on the team in the database (no shirt number)
async function addDbPlayer(){
  const name=$('dbName').value.trim(); if(!name)return;
  const tid=teamIdFor(lineupTeam);
  if(!sb||!tid){alert('Chưa kết nối database hoặc match chưa gắn team.');return;}
  if(dbPlayers[lineupTeam].some(p=>p.name.toLowerCase()===name.toLowerCase())
     && !confirm('"'+name+'" đã có trong database. Vẫn tạo bản ghi mới?'))return;
  const pos=$('dbPos').value.trim()||null;
  const {error}=await sb.from('players').insert({team_id:tid,name,position:pos});
  if(error){alert('Không lưu được cầu thủ: '+error.message);return;}
  $('dbName').value='';$('dbPos').value='';$('dbName').focus();
  await loadDbPlayers();
}
// DB player -> match squad: assign the shirt number worn in THIS match
function addToSquad(p){
  const t=teamLU();
  let no=prompt('Số áo của '+p.name+' trong trận này:'); if(no==null)return;
  no=String(no).trim();
  if(!no){alert('Cần nhập số áo.');return;}
  if(t.roster.some(r=>String(r.no)===no)){alert('Số '+no+' đã được dùng trong danh sách trận.');return;}
  t.roster.push({no,name:p.name,pid:p.id});
  save();renderLineup();
}

function renderLineup(){
  $('luHomeBtn').className=lineupTeam==='home'?'act-home':'';
  $('luAwayBtn').className=lineupTeam==='away'?'act-away':'';
  $('luHomeBtn').textContent=meta.home;
  $('luAwayBtn').textContent=meta.away;
  const t=teamLU(), ros=$('luRoster'); ros.innerHTML='';
  t.roster.forEach(p=>{
    const xiE=t.xi.find(x=>x.no===p.no), inXI=!!xiE, inSub=t.subs.includes(p.no);
    const row=document.createElement('div'); row.className='lu-prow';
    row.innerHTML=`<span class="num">${p.no}</span><span class="pname">${p.name||''}</span><span class="ppos">${xiE?(xiE.pos||''):''}</span>`;
    const xiB=document.createElement('button');xiB.textContent='XI';if(inXI)xiB.className='on';xiB.onclick=()=>toggleXI(p.no);
    const sB=document.createElement('button');sB.textContent='Sub';if(inSub)sB.className='on';sB.onclick=()=>toggleSub(p.no);
    const rm=document.createElement('button');rm.className='rm';rm.textContent='×';rm.title='remove';rm.onclick=()=>removeLuPlayer(p.no);
    row.append(xiB,sB,rm); ros.appendChild(row);
  });
  const subs=$('luSubs'); subs.innerHTML='';
  t.subs.forEach(no=>{const p=rosterPlayer(t,no);if(!p)return;const c=document.createElement('span');c.className='lu-chip';c.innerHTML=`<span class="num">${p.no}</span>${p.name||''}`;subs.appendChild(c);});
  $('luCount').textContent='Starters '+t.xi.length+'/'+maxXI()+' · Subs '+t.subs.length;
  renderDbRoster();
  renderLuPitch();
}
function renderLuPitch(){
  const t=teamLU(), pit=$('luPitch');
  pit.innerHTML=pitchSVG('football')+gridHTML(t.dir);
  t.xi.forEach(x=>{
    const p=rosterPlayer(t,x.no);
    const dot=document.createElement('div');
    dot.className='lu-dot'+(lineupTeam==='away'?' away':'');
    dot.style.left=x.x+'%'; dot.style.top=x.y+'%';
    dot.innerHTML=`${x.no}<span class="lbl">${p?(p.name||''):''}</span>`;
    luDrag(dot,x); pit.appendChild(dot);
  });
}
function luDrag(dot,x){
  dot.onpointerdown=e=>{
    e.preventDefault(); dot.setPointerCapture(e.pointerId); dot.style.cursor='grabbing';
    const pit=$('luPitch'), dir=teamLU().dir;
    const move=ev=>{const r=pit.getBoundingClientRect();
      x.x=Math.max(0,Math.min(100,(ev.clientX-r.left)/r.width*100));
      x.y=Math.max(0,Math.min(100,(ev.clientY-r.top)/r.height*100));
      x.pos=zoneAt(x.x,x.y,dir);
      dot.style.left=x.x+'%'; dot.style.top=x.y+'%';};
    const up=()=>{dot.style.cursor='grab';document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);save();renderLineup();};
    document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
  };
}
function toggleXI(no){const t=teamLU(), i=t.xi.findIndex(x=>x.no===no);
  if(i>=0)t.xi.splice(i,1);
  else{if(t.xi.length>=maxXI()){alert('Starting lineup is full ('+maxXI()+').');return;}
    t.subs=t.subs.filter(n=>n!==no); const nx=50,ny=Math.min(90,12+t.xi.length*8); t.xi.push({no,x:nx,y:ny,pos:zoneAt(nx,ny,t.dir)});}
  save();renderLineup();}
function toggleSub(no){const t=teamLU();
  if(t.subs.includes(no))t.subs=t.subs.filter(n=>n!==no);
  else{t.xi=t.xi.filter(x=>x.no!==no); t.subs.push(no);}
  save();renderLineup();}
function removeLuPlayer(no){const t=teamLU();
  t.roster=t.roster.filter(p=>p.no!==no); t.xi=t.xi.filter(x=>x.no!==no); t.subs=t.subs.filter(n=>n!==no);
  save();renderLineup();}
function addLuPlayer(){const no=$('luNo').value.trim(); if(!no)return; const t=teamLU();
  if(t.roster.some(p=>p.no===no)){alert('No. '+no+' already exists.');return;}
  t.roster.push({no,name:$('luName').value.trim()});
  $('luNo').value='';$('luName').value=''; save();renderLineup(); $('luNo').focus();}
function luSwitchDir(){const t=teamLU(); t.dir=t.dir==='rl'?'lr':'rl';
  t.xi.forEach(x=>{x.x=100-x.x; x.pos=zoneAt(x.x,x.y,t.dir);}); save();renderLineup();}

$('luHomeBtn').onclick=()=>{lineupTeam='home';renderLineup();};
$('luAwayBtn').onclick=()=>{lineupTeam='away';renderLineup();};
$('luAdd').onclick=addLuPlayer;
$('luName').addEventListener('keydown',e=>{if(e.key==='Enter')addLuPlayer();});
$('luNo').addEventListener('keydown',e=>{if(e.key==='Enter')$('luName').focus();});
$('dbAdd').onclick=addDbPlayer;
$('dbName').addEventListener('keydown',e=>{if(e.key==='Enter')$('dbPos').focus();});
$('dbPos').addEventListener('keydown',e=>{if(e.key==='Enter')addDbPlayer();});
$('luDir').onclick=luSwitchDir;

/* live sync with the main tagging tab (team names / sport / team ids / cloud edits) */
window.addEventListener('storage',e=>{
  if(e.key===PT_KEYS.meta){meta=loadMeta();renderLineup();loadDbPlayers();}
  else if(e.key===PT_KEYS.lineups){lineups=loadLineups();renderLineup();}
});

renderLineup();
initDB();
</script>
</body>
</html>
