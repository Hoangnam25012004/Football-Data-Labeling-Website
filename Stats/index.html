<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stats — Pitch Tagger</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="../shared.css?v=2">
</head>
<body>
<header>
  <h1>Hoang<span>Nam</span> · Stats</h1>
  <div class="stats-toggle" style="margin-left:14px">
    <button id="statGenBtn">General</button>
    <button id="statHomeBtn"></button>
    <button id="statAwayBtn"></button>
  </div>
  <!-- category tabs (only for Home / Away): the 34-column table split into 4 views -->
  <div class="stats-toggle" id="catToggle" style="margin-left:10px;display:none">
    <button data-cat="shooting">Shooting</button>
    <button data-cat="distribution">Distribution</button>
    <button data-cat="defensive">Defensive</button>
    <button data-cat="other">Other</button>
  </div>
  <div class="spacer"></div>
  <div class="exports">
    <button id="expXlsx">⭳ XLSX</button>
    <button id="expCsv">⭳ CSV</button>
  </div>
  <a class="back-link" href="../">← Tagging</a>
</header>
<div class="page">
  <div class="stats-wrap"><div id="statsHolder"></div></div>
</div>

<script src="../shared.js?v=3"></script>
<script>
let rows=loadRows(), meta=loadMeta(), statTeam='general', statCat='shooting';

/* per-category column sets — the wide table split into 4 tabs.
   Defensive = Defensive + Duels; Other = Set Pieces + Discipline. */
const STAT_CATS={
  shooting:[
    ['Goals',s=>s.goals],['Assists',s=>s.assists],['Key Passes',s=>s.keyPasses],
    ['Total Shots',s=>s.totalShots],['Shots On Target',s=>s.shotsOn],['Shots Off Target',s=>s.shotsOff],
    ['Blocked Shots',s=>s.shotsBlocked],
    ['Shooting Accuracy',s=>pct(s.shotsOn,s.totalShots)]],
  distribution:[
    ['Passes',s=>s.passes],['Passes Completed',s=>s.passesComp],['Pass Accuracy',s=>pct(s.passesComp,s.passes)],
    ['Crosses',s=>s.crosses],['Crosses Completed',s=>s.crossesComp],['Cross Accuracy',s=>pct(s.crossesComp,s.crosses)],
    ['Take-ons',s=>s.takeOns],['Take-ons Won',s=>s.takeOnsWon],['Take-on Success',s=>pct(s.takeOnsWon,s.takeOns)],
    ['Step-ins',s=>s.stepIns]],
  defensive:[
    ['Tackles',s=>s.tackles],['Tackles Won',s=>s.tacklesWon],['Tackle Success',s=>pct(s.tacklesWon,s.tackles)],
    ['Interceptions',s=>s.interceptions],['Clearances',s=>s.clearances],['Blocks',s=>s.blocks],['Recoveries',s=>s.recoveries],
    ['Ground Duels',s=>s.groundDuels],['Ground Duels Won',s=>s.groundDuelsWon],
    ['Aerial Duels',s=>s.aerialDuels],['Aerial Duels Won',s=>s.aerialDuelsWon]],
  other:[
    ['Corners',s=>s.corners],['Free-kicks',s=>s.freeKicks],['Penalty Kicks',s=>s.penalties],
    ['Fouls',s=>s.fouls],['Offsides',s=>s.offsides],['Mistakes',s=>s.mistakes],['Saves',s=>s.saves]]
};

function renderStats(){
  $('statGenBtn').className=statTeam==='general'?'act-gen':'';
  $('statHomeBtn').className=statTeam==='home'?'act-home':'';
  $('statAwayBtn').className=statTeam==='away'?'act-away':'';
  $('statHomeBtn').textContent=meta.home;
  $('statAwayBtn').textContent=meta.away;
  $('catToggle').style.display=statTeam==='general'?'none':'flex';
  document.querySelectorAll('#catToggle button').forEach(b=>b.className=b.dataset.cat===statCat?'act-gen':'');
  const holder=$('statsHolder');
  if(statTeam==='general'){renderGeneral();return;}
  const P=computeStats(rows,statTeam), players=sortedPlayers(P);
  if(!players.length){holder.innerHTML='<div class="stats-empty">No events for this team yet.</div>';return;}
  const cols=STAT_CATS[statCat];
  const head='<th class="no">No</th>'+cols.map(c=>`<th>${c[0]}</th>`).join('');
  const body=players.map(no=>'<tr><td class="no">'+no+'</td>'
    +cols.map(c=>`<td>${c[1](P[no])}</td>`).join('')+'</tr>').join('');
  // per-category chart on top: Shooting -> donut, Distribution -> pass scatter
  const chart = statCat==='shooting' ? shootingChartHTML(statTeam)
              : statCat==='distribution' ? passScatterHTML(statTeam) : '';
  holder.innerHTML=chart
    +`<table class="stats"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`
    +(statCat==='distribution'?passMatrixHTML(statTeam):'');   // pass matrix lives in Distribution
}
/* ---- Shooting: donut of Goals / On-target / Off-target+Blocked (image 1) ---- */
function arcPath(cx,cy,rr,a0,a1){
  const p=a=>[cx+rr*Math.cos(a),cy+rr*Math.sin(a)];
  const [x0,y0]=p(a0),[x1,y1]=p(a1), large=(a1-a0)>Math.PI?1:0;
  return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${rr} ${rr} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
function shootingChartHTML(team){
  const s=sumTeam(rows,team), total=s.totalShots;
  const name=team==='home'?meta.home:meta.away, teamColor=team==='home'?'var(--home)':'var(--away)';
  if(!total)return `<div class="chart-card"><div class="chart-title" style="color:${teamColor}">${name} — Shooting</div><div class="stats-empty">No shots yet.</div></div>`;
  const goals=s.goals, onNon=Math.max(0,s.shotsOn-s.goals), off=s.shotsOff+s.shotsBlocked;
  const segs=[['Goals',goals,'#f7b32f'],['On Target',onNon,'#39d98a'],['Off Target / Blocked',off,'#8b97a7']];
  const cx=90,cy=90,rr=62,thick=26; let a=-Math.PI/2, ring='';
  segs.forEach(([lbl,val,col])=>{
    if(val<=0)return;
    const frac=val/total, a1=a+frac*2*Math.PI;
    ring += frac>=0.9999
      ? `<circle cx="${cx}" cy="${cy}" r="${rr}" fill="none" stroke="${col}" stroke-width="${thick}"/>`
      : `<path d="${arcPath(cx,cy,rr,a,a1)}" fill="none" stroke="${col}" stroke-width="${thick}"/>`;
    a=a1;
  });
  const svg=`<svg viewBox="0 0 180 180" width="170" height="170">${ring}`
    +`<text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="13" fill="var(--mut)">Goals</text>`
    +`<text x="${cx}" y="${cy+26}" text-anchor="middle" font-size="36" font-weight="800" fill="var(--ink)">${goals}</text></svg>`;
  const legend=
     `<div class="leg-row"><span class="leg-lbl">Total Shots</span><span class="leg-val">${total}</span></div>`
    +`<div class="leg-row"><span class="leg-dot" style="background:#f7b32f"></span><span class="leg-lbl">Goals</span><span class="leg-val">${goals}</span></div>`
    +`<div class="leg-row"><span class="leg-dot" style="background:#39d98a"></span><span class="leg-lbl">On Target</span><span class="leg-val">${pct(s.shotsOn,total)}<span class="leg-sub">${s.shotsOn}/${total}</span></span></div>`
    +`<div class="leg-row"><span class="leg-dot" style="background:#8b97a7"></span><span class="leg-lbl">Off Target / Blocked</span><span class="leg-val"><span class="leg-sub">${off}/${total}</span></span></div>`;
  return `<div class="chart-card"><div class="chart-title" style="color:${teamColor}">${name} — Shooting</div>`
    +`<div class="donut-wrap"><div class="donut-svg">${svg}</div><div class="donut-legend">${legend}</div></div></div>`;
}
/* ---- Distribution: each player a bubble at (pass accuracy %, pass volume) (image 2) ---- */
function passScatterHTML(team){
  const P=computeStats(rows,team), name=team==='home'?meta.home:meta.away;
  const teamColor=team==='home'?'var(--home)':'var(--away)', fill=team==='home'?'#2f81f7':'#f7682f';
  const players=sortedPlayers(P).filter(no=>P[no].passes>0);
  if(!players.length)return `<div class="chart-card"><div class="chart-title" style="color:${teamColor}">${name} · Passes by Volume &amp; Accuracy</div><div class="stats-empty">No passes yet.</div></div>`;
  const W=680,H=300,mL=44,mR=22,mT=18,mB=36, maxVol=Math.max(...players.map(no=>P[no].passes));
  const X=acc=>mL+(acc/100)*(W-mL-mR), Y=vol=>H-mB-(maxVol?vol/maxVol:0)*(H-mT-mB);
  let g=`<rect x="${mL}" y="${mT}" width="${W-mL-mR}" height="${H-mT-mB}" fill="none" stroke="var(--line)"/>`;
  g+=`<line x1="${X(50)}" y1="${mT}" x2="${X(50)}" y2="${H-mB}" stroke="var(--line)" stroke-dasharray="4 4"/>`;
  g+=`<line x1="${mL}" y1="${Y(maxVol/2)}" x2="${W-mR}" y2="${Y(maxVol/2)}" stroke="var(--line)" stroke-dasharray="4 4"/>`;
  g+=`<text x="${mL}" y="${H-10}" font-size="11" fill="var(--mut)">0%</text>`;
  g+=`<text x="${X(50)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--mut)">Pass Accuracy →</text>`;
  g+=`<text x="${W-mR}" y="${H-10}" text-anchor="end" font-size="11" fill="var(--mut)">100%</text>`;
  g+=`<text x="10" y="${mT+10}" font-size="11" fill="var(--mut)">↑ Volume</text>`;
  const bubbles=players.map(no=>{
    const s=P[no], acc=s.passes?s.passesComp/s.passes*100:0, rr=9+(s.passes/maxVol)*11;
    const cx=X(acc), cy=Y(s.passes);
    return `<g><circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${rr.toFixed(1)}" fill="${fill}" fill-opacity="0.92" stroke="#0d1117" stroke-width="1.5"/>`
      +`<text x="${cx.toFixed(1)}" y="${(cy+3.5).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">${no}</text></g>`;
  }).join('');
  return `<div class="chart-card"><div class="chart-title" style="color:${teamColor}">${name} · Passes by Volume &amp; Accuracy</div>`
    +`<div class="scatter-wrap"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="width:100%;max-width:${W}px">${g}${bubbles}</svg></div></div>`;
}
function passMatrixHTML(team){
  const {players,mtx}=passMatrix(rows,team);
  const name=team==='home'?meta.home:meta.away;
  if(!players.length)return `<div class="pm-title" style="color:${team==='home'?'var(--home)':'var(--away)'}">${name} — Pass Distribution</div><div class="stats-empty">No completed passes for this team yet.</div>`;
  let max=0; players.forEach(f=>players.forEach(t=>{if(f!==t)max=Math.max(max,(mtx[f]&&mtx[f][t])||0);}));
  const rgb=team==='home'?'47,129,247':'247,104,47';
  const bg=v=>v?`style="background:rgba(${rgb},${(0.12+0.6*v/(max||1)).toFixed(3)})"`:'';
  let head='<th class="pm-h">From \\ To</th>'+players.map(p=>`<th class="pm-h">${p}</th>`).join('')+'<th class="pm-h">Σ</th>';
  const colSum={}; let grand=0, body='';
  players.forEach(f=>{
    let rowSum=0, cells='';
    players.forEach(t=>{
      if(f===t){cells+='<td class="pm-diag">–</td>';return;}
      const v=(mtx[f]&&mtx[f][t])||0; rowSum+=v; colSum[t]=(colSum[t]||0)+v; grand+=v;
      cells+=`<td ${bg(v)}>${v||'<span class="pm-z">0</span>'}</td>`;
    });
    body+=`<tr><th class="pm-rh">${f}</th>${cells}<td class="pm-sum">${rowSum}</td></tr>`;
  });
  const foot='<th class="pm-rh">Σ recv</th>'+players.map(p=>`<td class="pm-sum">${colSum[p]||0}</td>`).join('')+`<td class="pm-sum">${grand}</td>`;
  return `<div class="pm-title" style="color:${team==='home'?'var(--home)':'var(--away)'}">${name} — Pass Distribution</div>`
    +`<div class="pm-wrap pm-${team}"><table class="pmtx"><thead><tr>${head}</tr></thead><tbody>${body}<tr>${foot}</tr></tbody></table></div>`;
}
function renderGeneral(){
  const h=sumTeam(rows,'home'), a=sumTeam(rows,'away');
  let html=`<div class="gen-wrap"><div class="gen-top"><span class="gh">${meta.home}</span><span>Team Comparison</span><span class="ga">${meta.away}</span></div>`;
  TEAM_SECTIONS.forEach(sec=>{
    html+=`<div class="gen-sec">${sec[0]}</div>`;
    sec[1].forEach(([label,fn])=>{
      const hv=fn(h,a), av=fn(a,h);
      const hnum=numOf(hv), anum=numOf(av), tot=hnum+anum;
      const hp=tot?Math.round(hnum/tot*100):50;
      html+=`<div class="gen-row"><span class="vh">${hv}</span>`+
            `<div class="gen-bar lbar"><div class="bh" style="width:${hp}%"></div></div>`+
            `<span class="lbl">${label}</span>`+
            `<div class="gen-bar rbar"><div class="ba" style="width:${100-hp}%"></div></div>`+
            `<span class="va">${av}</span></div>`;
    });
  });
  $('statsHolder').innerHTML=html+'</div>';
}

/* ---- exports (full workbook: events + stats + pass distribution) ---- */
let dur=loadJSON(PT_KEYS.duration,{enabled:false,halfLen:45,h1Start:0,h1End:0,h2Start:0,h2End:0});
function fmt(t){const m=Math.floor(t/60),s=Math.floor(t%60),cs=Math.floor((t%1)*100);return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;}
function matchTime(vt){const d=dur; if(!d.enabled)return vt; const off=(+d.halfLen||45)*60;
  if(d.h2Start>0 && vt>=d.h2Start) return off+(vt-d.h2Start); return Math.max(0, vt-(d.h1Start||0));}
function eventHalf(r){const h2=dur.h2Start; return (h2>0 && r.t>=h2)?2:1;}
function buildData(half){
  const rs=rows.filter(r=>r.t!=null).sort((a,b)=>a.t-b.t).filter(r=>!half||eventHalf(r)===half);
  return rs.map((r,i)=>({no:i+1,timecode:fmt(matchTime(r.t)),match_seconds:+matchTime(r.t).toFixed(2),
    video_seconds:+(+r.t).toFixed(2),team:r.team,team_name:r.teamName||(r.team==='home'?meta.home:meta.away),event:r.event,
    player_from:r.playerFrom,player_x:r.pXY?+r.pXY.x.toFixed(1):'',player_y:r.pXY?+r.pXY.y.toFixed(1):'',
    player_to:r.playerTo,receiver_x:r.rXY?+r.rXY.x.toFixed(1):'',receiver_y:r.rXY?+r.rXY.y.toFixed(1):'',
    action_code:r.action,raw_input:r.raw}));
}
function eventsSheet(half){
  const ws=XLSX.utils.json_to_sheet(buildData(half));
  ws['!cols']=[{wch:5},{wch:10},{wch:13},{wch:13},{wch:7},{wch:14},{wch:14},{wch:11},{wch:8},{wch:8},{wch:9},{wch:9},{wch:9},{wch:9},{wch:16}];
  return ws;
}
function passSheet(team){
  const {players,mtx}=passMatrix(rows,team);
  const aoa=[['From \\ To',...players,'Σ']]; const colSum={}; let grand=0;
  players.forEach(f=>{let rowSum=0; const row=[f];
    players.forEach(t=>{if(f===t){row.push('–');return;}
      const v=(mtx[f]&&mtx[f][t])||0; rowSum+=v; colSum[t]=(colSum[t]||0)+v; grand+=v; row.push(v);});
    row.push(rowSum); aoa.push(row);});
  aoa.push(['Σ recv',...players.map(p=>colSum[p]||0),grand]);
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=aoa[0].map((h,i)=>({wch:i===0?9:Math.max(4,String(h).length+1)}));
  return ws;
}
function buildSheets(){
  return [['events_1st_half',eventsSheet(1)],['events_2nd_half',eventsSheet(2)],
          ['stats_home',statsSheet('home')],['stats_away',statsSheet('away')],
          ['pass_home',passSheet('home')],['pass_away',passSheet('away')],
          ['team_stats',teamStatsSheet()]];
}
function statsSheet(team){
  const P=computeStats(rows,team), players=sortedPlayers(P);
  const h1=new Array(STAT_HEADERS.length).fill(''); const merges=[];
  let c=0; STAT_GROUPS.forEach(g=>{if(g[0]){h1[c]=g[0]; if(g[1]>1)merges.push({s:{r:0,c},e:{r:0,c:c+g[1]-1}});} c+=g[1];});
  merges.push({s:{r:0,c:0},e:{r:1,c:0}});
  const aoa=[h1,STAT_HEADERS,...players.map(no=>statRow(no,P[no]))];
  const ws=XLSX.utils.aoa_to_sheet(aoa); ws['!merges']=merges;
  ws['!cols']=STAT_HEADERS.map((h,i)=>({wch:i===0?5:Math.max(7,h.length)}));
  return ws;
}
function teamStatsSheet(){
  const h=sumTeam(rows,'home'), a=sumTeam(rows,'away');
  const aoa=[[meta.home,'Team Comparison',meta.away]];
  TEAM_SECTIONS.forEach(sec=>{
    aoa.push([sec[0],'','']);
    sec[1].forEach(([label,fn])=>aoa.push([fn(h,a),label,fn(a,h)]));
    aoa.push(['','','']);
  });
  const ws=XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=[{wch:14},{wch:20},{wch:14}];
  return ws;
}
const matchName=()=>(meta.home||'Home')+'_vs_'+(meta.away||'Away');
$('expXlsx').onclick=()=>{
  if(!rows.length){alert('No data yet.');return;}
  const wb=XLSX.utils.book_new();
  buildSheets().forEach(([name,ws])=>XLSX.utils.book_append_sheet(wb,ws,name));
  XLSX.writeFile(wb,matchName()+'_events.xlsx');
};
// CSV can't hold multiple sheets -> download one .csv per sheet
$('expCsv').onclick=()=>{
  if(!rows.length){alert('No data yet.');return;}
  buildSheets().forEach(([name,ws],i)=>{
    const csv=XLSX.utils.sheet_to_csv(ws);
    const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=matchName()+'_'+name+'.csv';
    setTimeout(()=>{a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);},i*300);
  });
};

$('statGenBtn').onclick=()=>{statTeam='general';renderStats();};
$('statHomeBtn').onclick=()=>{statTeam='home';renderStats();};
$('statAwayBtn').onclick=()=>{statTeam='away';renderStats();};
document.querySelectorAll('#catToggle button').forEach(b=>b.onclick=()=>{statCat=b.dataset.cat;renderStats();});

/* live sync with the main tagging tab */
window.addEventListener('storage',e=>{
  if(e.key===PT_KEYS.rows){rows=loadRows();renderStats();}
  else if(e.key===PT_KEYS.meta){meta=loadMeta();syncBackLink(meta);renderStats();}
  else if(e.key===PT_KEYS.duration){dur=loadJSON(PT_KEYS.duration,dur);}
});

syncBackLink(meta);   // "← Tagging" returns to ../#match=<code>, keeping the match open
renderStats();
</script>
</body>
</html>
