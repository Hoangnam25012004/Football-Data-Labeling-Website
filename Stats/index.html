<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stats — Pitch Tagger</title>
<script src="../auth.js?v=1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="../shared.css?v=14">
<link rel="stylesheet" href="../shared-page.css?v=1">
<link rel="stylesheet" href="stats-view.css?v=11">
<style>
/* The page shell only. Everything the view itself draws with is in
   stats-view.css, which the client site loads too. */
html,body{height:100%}
body{display:flex;flex-direction:column}
body>header{flex:none}
</style>
</head>
<body>
<header>
  <h1>Hoang<span>Nam</span></h1>
  <div class="stats-toggle" style="margin-left:14px">
    <button id="viewOverallBtn">Overall</button>
    <button id="viewDashBtn">Dashboard</button>
    <button id="viewStatsBtn">Stats</button>
    <button id="viewFilmBtn">Film</button>
  </div>
  <div class="spacer"></div>
  <div class="exports">
    <button id="expXlsx">⭳ XLSX</button>
    <button id="expCsv">⭳ CSV</button>
    <button id="expPdf">⭳ PDF</button>
  </div>
</header>
<div class="page">
  <!-- events and squads belong to a match — without one open there is nothing to report on -->
  <div id="noMatchMsg" style="display:none;padding:48px 20px;text-align:center;color:var(--mut);font-size:13px;line-height:1.8">
    <div style="font-size:28px">📊</div>
    <b style="color:var(--ink)">No match is open</b><br>
    Stats belong to a match. Go back to the tagging tab, open <b>☁ Cloud</b>
    to create or join a match, then reopen this page.
  </div>
  <!-- which side Dashboard / Stats are about — centred on its own row under the
       header, so the top line carries the three views and the exports, nothing else -->
  <div class="stats-toggle sub-row sub-team" id="teamToggle" style="display:none">
    <button id="statHomeBtn"></button>
    <button id="statAwayBtn"></button>
  </div>
  <!-- category tabs (Dashboard / Stats only): the whole player table, and the
       visualizations that go with it, split into 6 views. Must stay identical to
       the CHROME block in the view module, which is what a host bringing no
       chrome of its own is given. -->
  <div class="stats-toggle sub-row" id="catToggle" style="display:none">
    <button data-cat="shooting">Shooting</button>
    <button data-cat="distribution">Distribution</button>
    <button data-cat="defensive">Defensive</button>
    <button data-cat="goalkeeper">Goalkeeper</button>
    <button data-cat="setPieces">Set Pieces</button>
    <button data-cat="fouls">Fouls</button>
  </div>
  <div class="stats-wrap"><div id="statsHolder"></div></div>
</div>

<script src="../shared.js?v=27"></script>
<script src="stats-view.js?v=27"></script>
<script>
/* This page brings its own header and its own toggles, so the view is mounted
   into the markup already on it rather than rendering a set of its own. It also
   keeps both ways it has always found data: the tagging tab's localStorage, and
   a #match= link loaded over the cloud. Neither changed when the view moved into
   stats-view.js — the lines that do it moved across with everything else. */
PTStats.mount(document.querySelector('.page'), null, {chrome:false, local:true, cloud:true});
</script>
<script src="report.js?v=41"></script>
</body>
</html>
