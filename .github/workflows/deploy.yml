name: Deploy website to GitHub Pages

# Redeploys the site automatically on every push to main,
# and can also be run manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the deploy job needs to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; newer pushes cancel in-flight runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Stage only the files the public site needs (keeps the upload clean)
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp cloud-sync.js _site/cloud-sync.js
          cp pitchtagger_events.json _site/pitchtagger_events.json || true
          # shared assets used by the standalone sub-pages
          cp shared.css _site/shared.css
          cp shared.js _site/shared.js
          # standalone Stats and Player-Lists pages
          mkdir -p _site/Stats _site/Player-Lists
          cp Stats/index.html _site/Stats/index.html
          cp Player-Lists/index.html _site/Player-Lists/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
